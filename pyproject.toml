[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "guarded-paper-trader"
version = "0.1.0"
requires-python = ">=3.11"
description = "Paper-only cryptocurrency trading engine"
[project.scripts]
paper-trader = "trading_bot.cli:main"
[tool.setuptools.packages.find]
include = ["trading_bot*"]
