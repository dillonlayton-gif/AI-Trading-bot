name: Offline paper, data, indicators and backtest validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[market]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_market_data.py
      - run: python scripts/validate_indicators.py
      - run: python scripts/validate_backtest.py
      - run: python scripts/scan_secrets.py
      - run: python -m trading_bot.cli replay data/example.csv --db paper-smoke.db --buy-quantity 0.5
